<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Tution</title>
    <meta name="description" content="Smart tuition management app for students and teachers – track classes, homework, attendance, and performance in one place. Boost learning with real-time insights and easy organization." />
    <link rel="icon" type="image/png" href="/icons/pwa-192.png" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />

    <!-- Critical inlined CSS for first paint -->
    <style>
      html, body { margin:0; padding:0; min-height:100%; }
      body { background:#f5f2e8; color:#0d1b1e; font-family:"Work Sans",system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      #root { min-height:100vh; }
      .loading-skeleton { display:grid; place-items:center; height:100vh; width:100%; color:#66757f; font-size:1rem; }
      .update-popup-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:10000; }
      .update-popup-card { background:#1a1a1a; border-radius:12px; padding:24px; max-width:300px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
      .update-popup-icon { font-size:2rem; margin-bottom:16px; }
      .update-popup-title { margin:0 0 8px 0; font-size:1.25rem; font-weight:600; color:#fff; }
      .update-popup-text { margin:0 0 20px 0; color:#b0b0b0; }
      .update-popup-btn { background:#ff7a59; color:#fff; border:none; padding:12px 24px; border-radius:8px; font-weight:500; cursor:pointer; }
      .update-popup-btn:hover { background:#e66a4e; }
    </style>

    <!-- Use Google Fonts for reliable font loading (fallback if offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" />

    <link rel="preload" as="style" href="/src/ui/styles.css" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/src/ui/styles.css" /></noscript>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ff7a59" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
